<style>
:root{color-scheme:dark;--bg:#101b25;--panel:#182833;--ink:#f4f0e7;--muted:#a8b6b7;--gold:#f2c66d;--teal:#79d4c5;--line:#38505a;--red:#ef8e7c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#2d4952 0,transparent 58%),var(--bg);color:var(--ink);font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}.wrap{width:min(1280px,100%);margin:auto;padding:22px 18px 42px}.top,.toolbar,.row,.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:18px}.brand{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.18em}.brand span{color:var(--muted);font-weight:500}.tag{color:var(--teal);border:1px solid #79d4c555;border-radius:99px;padding:7px 11px;font-size:10px;letter-spacing:.16em}.toolbar{justify-content:flex-start;flex-wrap:wrap;margin-bottom:12px}.card{background:linear-gradient(145deg,#20343ff5,#182833f5);border:1px solid #334c56;border-radius:17px;padding:18px;box-shadow:0 18px 55px #0003}.button{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#ffffff0b;color:var(--ink);font-weight:700;text-decoration:none}.button.primary{background:var(--gold);border-color:var(--gold);color:#172126}.button:hover{border-color:var(--teal)}.status{min-height:18px;margin:0 0 12px;color:var(--teal);font-size:12px}.layout{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:14px;align-items:start}.list{display:grid;gap:7px}.person{width:100%;text-align:left;background:#101b2566;color:var(--ink);border:1px solid #ffffff1b;border-radius:10px;padding:10px 12px}.person.active{border-color:var(--gold);background:#f2c66d12}.person small{display:block;color:var(--muted);margin-top:4px}.panel-title{margin:0 0 12px;font-size:15px}.panel-title small{color:var(--muted);font-size:10px;font-weight:500}.field{display:grid;gap:5px;color:var(--muted);font-size:11px}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#101b25;color:var(--ink);padding:9px 10px}.field textarea{min-height:82px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12px}.check input{accent-color:var(--teal)}.hint{color:var(--muted);font-size:11px;line-height:1.7}.divider{height:1px;background:var(--line);margin:14px 0}.condition-list{display:grid;gap:7px}.condition-row{display:grid;grid-template-columns:minmax(140px,.65fr) minmax(0,1fr) auto;gap:7px;margin-top:7px}.condition-row select,.condition-row input{min-width:0;background:#101b25;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px}.icon{border:0;background:transparent;color:var(--muted);padding:5px}.icon:hover{color:var(--gold)}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview-card{border:1px solid #ffffff1e;border-radius:12px;padding:10px;background:#101b2599}.preview-card h3{font-size:10px;letter-spacing:.13em;color:var(--gold);margin:0 0 8px}.chat-preview{min-height:90px;display:flex;align-items:center;gap:10px}.chat-preview img,.avatar-fallback{width:52px;height:52px;object-fit:cover;border-radius:50%;border:1px solid #d3b56c77;background:#243740;display:grid;place-items:center;color:var(--gold);font-size:20px}.portrait-preview{height:180px;position:relative;overflow:hidden;border-radius:8px;background:radial-gradient(ellipse,#31515b,#0c151c)}.portrait-preview>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.66}.portrait-preview>img.portrait{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94%;max-width:80%;object-fit:contain;filter:drop-shadow(0 5px 14px #0009)}.portrait-placeholder{position:absolute;inset:auto 0 13px;text-align:center;color:#d5dfd8;text-shadow:0 2px 6px #000;font:20px Georgia,serif}.file{display:none}.image-field{display:flex;align-items:stretch;gap:7px}.image-field input{flex:1;min-width:0}.image-picker{position:relative;display:inline-flex;align-items:center;min-width:0}.image-import{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#ffffff0b;color:var(--ink);font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap}.image-import:hover,.image-import:focus-visible{border-color:var(--teal);outline-color:var(--teal)}.image-file-input{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important;pointer-events:none!important}.cpu-link-panel{grid-column:1/-1;padding:13px;border:1px solid #79d4c555;border-radius:12px;background:#79d4c50a}.cpu-link-panel h3{margin:0 0 7px;color:var(--teal);font-size:13px}.cpu-link-panel p{margin:0 0 10px}.cpu-link-status{margin-top:8px;padding:9px 11px;border-radius:8px;background:#101b25;color:var(--gold);font-size:12px}.expression-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.expression-preview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.expression-preview{min-width:0;border:1px solid #ffffff1e;border-radius:9px;padding:6px;text-align:center;background:#101b2599}.expression-preview img{display:block;width:100%;height:90px;object-fit:contain;background:#0b151c;border-radius:6px}.expression-preview small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.image-help{font-size:10px;color:var(--muted);line-height:1.6}@media(max-width:760px){.expression-grid{grid-template-columns:1fr}.expression-preview-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}.empty{padding:14px;border:1px dashed #4a626a;border-radius:10px;color:var(--muted);font-size:12px;text-align:center}.foot{color:#829394;text-align:center;font-size:10px;line-height:1.7;margin:15px 8px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid2,.preview-grid{grid-template-columns:1fr}}@media(max-width:540px){.wrap{padding:14px 11px 30px}.condition-row{grid-template-columns:1fr 1fr}.condition-row input{grid-column:1}.condition-row .icon{grid-column:2;grid-row:1/3}}

</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">CHRONOS <span>/ CHARACTER STUDIO</span></div><div class="tag">OFFLINE AUTHORING</div></header>
  <p class="hint" style="margin:-8px 0 14px"><a href="../../docs/story/シナリオ作成マニュアル.md">操作マニュアル・JSONの配置方法 ↗</a></p>
<div class="toolbar"><a class="button" href="./story-scenario-studio.html">← シナリオ編集へ</a><button id="addCharacter" class="button">＋ ネームドNPC</button><button id="importButton" class="button">JSONを読込</button><button id="exportButton" class="button primary">JSONを書き出す</button><input id="importFile" class="file" type="file" accept="application/json,.json"></div>
<p id="status" class="status" role="status">人物データを読み込み中…</p>
<div class="layout"><aside class="card"><h2 class="panel-title">人物 <small id="count"></small></h2><div id="people" class="list"></div></aside><section class="card"><div id="editor"></div></section></div>
<p class="foot">ネームドCPUとの共通ID・プロフィール連携を保ちつつ、ストーリー用アイコン、立ち絵、背景、登場条件を別設定します。Firebaseには接続しません。</p>
</main>
<script src="./studio-common.js"></script>
<script>
(()=>{'use strict';
const KEY='chronos_story_characters_draft_v1',$=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeId=()=> 'story_npc_'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,10):Math.random().toString(36).slice(2,12));
const conditionTypes=[['event_completed','イベント完了'],['scenario_completed','シナリオ完了'],['achievement_earned','実績獲得']];
const expressionTypes=[['happy','嬉しい立ち絵'],['sad','悲しい立ち絵'],['angry','怒る立ち絵'],['surprised','驚く立ち絵'],['neutral','無表情立ち絵'],['troubled','困る立ち絵'],['smug','ニヤつく立ち絵']];
const imageField=(label,key,value,placeholder,characterId)=>{const shown=String(value||'').startsWith('data:image/')?'（埋め込み画像）':(value||'');return '<div class="field"><span>'+label+'</span><div class="image-field"><input data-field="'+key+'" value="'+esc(shown)+'" placeholder="'+esc(placeholder||'画像ファイルを取り込むかパスを入力')+'"><span class="image-picker"><button type="button" class="image-import" data-image-trigger>画像を取り込む</button><input class="image-file-input" type="file" accept="image/png,image/jpeg,image/webp,image/avif,image/gif" data-image-upload="'+key+'" data-character-id="'+esc(characterId)+'"></span></div></div>'};
let data={format:'chronos-story-characters',schemaVersion:1,metadata:{title:'CHRONOS Story Characters',version:1},characters:[]},profiles=[],world=null,activeId='';
const active=()=>data.characters.find(x=>x.id===activeId);
function say(text,bad=false){$('status').textContent=text;$('status').style.color=bad?'var(--red)':'var(--teal)'}
function save(){data.metadata.updatedAt=new Date().toISOString();window.ChronosStudio.saveDraft(KEY,data).then(kind=>say('人物データを'+kind+'に保存しました。')).catch(error=>say('下書き保存に失敗しました: '+error.message+'。JSONを書き出してください。',true))}
function normalize(){data.characters=Array.isArray(data.characters)?data.characters:[];data.characters.forEach(c=>{c.eventTags=Array.isArray(c.eventTags)?c.eventTags:[];c.unlock=c.unlock||{operator:'all',conditions:[]};c.unlock.conditions=Array.isArray(c.unlock.conditions)?c.unlock.conditions:[];c.availableAtStart=Boolean(c.availableAtStart);c.portraitExpressions=c.portraitExpressions&&typeof c.portraitExpressions==='object'?c.portraitExpressions:{};expressionTypes.forEach(([key])=>{c.portraitExpressions[key]=String(c.portraitExpressions[key]||'')})});if(!activeId||!active())activeId=data.characters[0]?.id||''}
function renderList(){normalize();$('count').textContent=data.characters.length+'人';$('people').innerHTML=data.characters.map(c=>'<button class="person'+(c.id===activeId?' active':'')+'" data-person="'+esc(c.id)+'"><b>'+esc(c.name||'名称未設定')+'</b><small>'+esc(c.role||'役割未設定')+' · '+(c.cpuProfileId?'CPU連携あり':'ストーリー専用')+'</small></button>').join('')||'<div class="empty">ネームドNPCを追加してください。</div>';renderEditor();renderPreview()}
function renderConditions(c){const rows=c.unlock.conditions.map((item,i)=>'<div class="condition-row" data-condition="'+i+'"><select data-condition-field="type">'+conditionTypes.map(t=>'<option value="'+t[0]+'"'+(item.type===t[0]?' selected':'')+'>'+t[1]+'</option>').join('')+'</select><input data-condition-field="targetId" value="'+esc(item.targetId||'')+'" placeholder="イベント/シナリオ/実績ID"><button class="icon" data-action="remove-condition" data-index="'+i+'">削除</button></div>').join('');return '<label class="field">複数条件の扱い<select data-field="unlock.operator"><option value="all"'+(c.unlock.operator!=='any'?' selected':'')+'>すべて満たす（AND）</option><option value="any"'+(c.unlock.operator==='any'?' selected':'')+'>いずれかを満たす（OR）</option></select></label><div class="condition-list">'+(rows||'<p class="hint">条件なし。最初から登場可能にする場合は上のチェックを使います。</p>')+'</div><button class="button" data-action="add-condition">＋ 登場条件</button>'}
function renderEditor(){
 const host=$('editor'),c=active();
 if(!c){host.innerHTML='<div class="empty">人物を追加してください。</div>';return}
 const linkedProfile=profiles.find(p=>p.id===c.cpuProfileId);
 const cpuOptions='<option value="">CPUと接続しない（ストーリー専用）</option>'+profiles.map(p=>'<option value="'+esc(p.id)+'"'+(c.cpuProfileId===p.id?' selected':'')+'>'+esc(p.name)+' · ID '+esc(p.id)+'</option>').join('');
 const expressionFields=expressionTypes.map(([key,label])=>imageField(label,'portraitExpressions.'+key,c.portraitExpressions?.[key]||'','story/assets/人物_'+key+'.png',c.id)).join('');
 host.innerHTML='<div class="row"><h2 class="panel-title">人物設定 <small>'+esc(c.id)+'</small></h2><button class="icon" data-action="delete-person">この人物を削除</button></div>'+
 '<div class="grid2"><label class="field">人物ID（固定キー）<input data-field="id" value="'+esc(c.id)+'" spellcheck="false" readonly></label><label class="field">表示名<input data-field="name" value="'+esc(c.name||'')+'" maxlength="60"></label><label class="field">役割・人物区分<input data-field="role" value="'+esc(c.role||'')+'" placeholder="例: 王、案内人、対戦相手"></label>'+
 '<section class="cpu-link-panel"><h3>対戦CPUとの接続</h3><p class="hint">この人物をゲーム内の対戦相手にもする場合、下の一覧から既存のネームドCPUを選びます。人物IDとCPUプロフィールIDは別でも構いません。接続後は、シナリオStudioの「戦闘セット／戦闘イベント」で同じCPU名を選択してください。</p><label class="field">接続するCPUプロフィール<select data-field="cpuProfileId">'+cpuOptions+'</select></label><div class="cpu-link-status">'+(linkedProfile?'接続中：'+esc(linkedProfile.name)+'（CPU ID: '+esc(linkedProfile.id)+'）':'未接続：この人物は会話・物語上の人物としてのみ登場します。')+'</div></section>'+
 imageField('チャット用アイコン','chatIcon',c.chatIcon,'story/assets/人物-icon.png',c.id)+imageField('通常のノベル立ち絵','portrait',c.portrait,'story/assets/人物.png',c.id)+imageField('標準背景','defaultBackground',c.defaultBackground,'story/assets/遺跡-background.jpg',c.id)+
 '<div style="grid-column:1/-1"><h3 class="panel-title">表情別の立ち絵 <small>7種類</small></h3><p class="hint">ここで登録した画像は、シナリオStudioのノベルゲーム風会話でセリフごとに選択できます。未登録の表情は通常の立ち絵に自動で戻ります。</p><div class="expression-grid">'+expressionFields+'</div></div>'+
 '<label class="field">イベントタグ（カンマ区切り）<input data-field="eventTagsText" value="'+esc((c.eventTags||[]).join(', '))+'" placeholder="案内人, 王族, 古代"></label><label class="field" style="grid-column:1/-1">制作者メモ<textarea data-field="notes" maxlength="1200">'+esc(c.notes||'')+'</textarea></label></div>'+
 '<label class="check" style="margin:12px 0"><input type="checkbox" data-field="availableAtStart"'+(c.availableAtStart?' checked':'')+'>ストーリー開始時から登場可能</label><div class="divider"></div><h3 class="panel-title">登場可能になる条件</h3><p class="hint">条件を追加すると「ストーリー開始時から登場可能」は自動でOFFになり、イベント・シナリオ・実績条件を満たした後に登場します。条件の評価はゲーム実行側で行います。</p>'+renderConditions(c)+'<div class="divider"></div>'+
 '<div class="preview-grid"><div class="preview-card"><h3>CHAT ICON</h3><div id="chatPreview" class="chat-preview"></div></div><div class="preview-card"><h3>VISUAL NOVEL PORTRAIT</h3><div id="portraitPreview" class="portrait-preview"></div></div></div><div class="preview-card" style="margin-top:10px"><h3>EXPRESSION PREVIEW · 表情画像プレビュー</h3><div id="expressionPreview" class="expression-preview-grid"></div></div>';
}function renderPreview(){
 const c=active();if(!c)return;
 const assetPreview=path=>{path=String(path||'').trim();return path&&!/^(?:https?:|data:|blob:|\/)/i.test(path)?'../../'+path:path};
 const icon=c.chatIcon?'<img src="'+esc(assetPreview(c.chatIcon))+'" alt="">':'<span class="avatar-fallback">'+esc((c.name||'?').slice(0,1))+'</span>';
 $('chatPreview').innerHTML=icon+'<span><b>'+esc(c.name||'人物名')+'</b><br><small class="hint">'+esc(c.role||'チャット表示サンプル')+'</small></span>';
 let html='';const defaultPortrait=c.portrait||c.portraitExpressions?.neutral||'';
 if(c.defaultBackground)html+='<img class="bg" src="'+esc(assetPreview(c.defaultBackground))+'" alt="">';
 if(defaultPortrait)html+='<img class="portrait" src="'+esc(assetPreview(defaultPortrait))+'" alt="">';else html+='<span class="portrait-placeholder">'+esc(c.name||'立ち絵未設定')+'</span>';
 $('portraitPreview').innerHTML=html;
 $('expressionPreview').innerHTML=expressionTypes.map(([key,label])=>{const src=c.portraitExpressions?.[key]||'';return '<div class="expression-preview"><img src="'+(src?esc(assetPreview(src)):'')+'" alt="'+esc(label)+'"'+(!src?' style="visibility:hidden"':'')+'><small>'+esc(label)+(src?'':' · 未登録')+'</small></div>'}).join('');
}function fieldInput(target){const c=active();if(!c)return;const path=target.dataset.field.split('.');let object=c;while(path.length>1)object=object[path.shift()];let value=target.type==='checkbox'?target.checked:target.value;if(target.dataset.field==='eventTagsText'){c.eventTags=value.split(',').map(x=>x.trim()).filter(Boolean);save();renderPreview();return}object[path[0]]=value;if(path[0]==='id'){const old=activeId;c.id=value;activeId=value;if(!value)activeId=old}save();if(target.dataset.field==='cpuProfileId')renderList();else renderPreview()}
function addCharacter(){const c={id:makeId(),name:'新しい人物',cpuProfileId:'',role:'ストーリーNPC',chatIcon:'',portrait:'',portraitExpressions:{happy:'',sad:'',angry:'',surprised:'',neutral:'',troubled:'',smug:''},defaultBackground:'',eventTags:[],availableAtStart:true,unlock:{operator:'all',conditions:[]},notes:''};data.characters.push(c);activeId=c.id;save();renderList()}
function validate(){const issues=[],seen=new Set(),profileIds=new Set(profiles.map(x=>x.id));for(const c of data.characters){if(!c.id?.trim()||seen.has(c.id))issues.push('人物IDが空か重複しています。');seen.add(c.id);if(!c.name?.trim())issues.push(c.id+' の表示名が空です。');if(c.cpuProfileId&&!profileIds.has(c.cpuProfileId))issues.push(c.name+' が参照するCPUプロフィールがありません。');for(const rule of c.unlock.conditions||[])if(!rule.targetId?.trim())issues.push(c.name+' の登場条件にIDがありません。')}return issues}
function exportJson(){const issues=validate();if(issues.length){say(issues.join(' / '),true);return}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='story-characters.json';a.click();URL.revokeObjectURL(url);say('story-characters.jsonを書き出しました。')}
async function handleImageUpload(input){
 const file=input.files&&input.files[0];if(!file)return;
 try{
  const image=await window.ChronosStudio.readImageFile(file),character=data.characters.find(item=>item.id===input.dataset.characterId);
  if(!character)throw new Error('対象の人物が見つかりません。');
  const path=input.dataset.imageUpload.split('.');let target=character;while(path.length>1){const key=path.shift();target[key]=target[key]&&typeof target[key]==='object'?target[key]:{};target=target[key]}target[path[0]]=image;
  save();if(character.id===activeId){renderList();say(character.name+' の画像を取り込みました。JSONを書き出すと画像データも保存されます。')}
 }catch(error){say(error.message||'画像の取り込みに失敗しました。',true)}finally{input.value=''}
}
function importFile(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(String(reader.result));if(d.format!=='chronos-story-characters'||d.schemaVersion!==1||!Array.isArray(d.characters))throw Error('story-characters形式ではありません。');data=d;activeId=data.characters[0]?.id||'';normalize();save();renderList();say('人物データを読み込みました。')}catch(e){say('読み込めませんでした: '+e.message,true)}};reader.readAsText(file)}
function click(event){const person=event.target.closest('[data-person]');if(person){activeId=person.dataset.person;renderList();return}const button=event.target.closest('[data-action]');if(!button)return;if(button.dataset.action==='add-condition'){const c=active();if(c){c.availableAtStart=false;c.unlock.conditions.push({type:'event_completed',targetId:''})}save();renderList()}else if(button.dataset.action==='remove-condition'){const c=active();c.unlock.conditions.splice(Number(button.dataset.index),1);save();renderList()}else if(button.dataset.action==='delete-person'){if(data.characters.length<2){say('最後の人物は削除できません。',true);return}if(confirm('この人物設定を削除しますか？')){data.characters=data.characters.filter(x=>x.id!==activeId);activeId=data.characters[0].id;save();renderList()}}}
document.addEventListener('change',e=>{if(e.target.matches('[data-image-upload]')){handleImageUpload(e.target);return}});document.addEventListener('input',e=>{if(e.target.dataset.field){fieldInput(e.target);return}if(e.target.dataset.conditionField){const c=active(),item=c?.unlock.conditions[Number(e.target.closest('[data-condition]').dataset.condition)];if(item){item[e.target.dataset.conditionField]=e.target.value;save()}}});document.addEventListener('change',e=>{if(e.target.dataset.field)fieldInput(e.target);else if(e.target.dataset.conditionField){const c=active(),item=c?.unlock.conditions[Number(e.target.closest('[data-condition]').dataset.condition)];if(item){item[e.target.dataset.conditionField]=e.target.value;save()}}});document.addEventListener('click',click);
$('addCharacter').addEventListener('click',addCharacter);$('exportButton').addEventListener('click',exportJson);$('importButton').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});
