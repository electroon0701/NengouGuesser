<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b25">
<title>Chronos | ネームドNPC設定</title>
<style>
:root{color-scheme:dark;--bg:#101b25;--panel:#182833;--ink:#f4f0e7;--muted:#a8b6b7;--gold:#f2c66d;--teal:#79d4c5;--line:#38505a;--red:#ef8e7c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#2d4952 0,transparent 58%),var(--bg);color:var(--ink);font:14px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}.wrap{width:min(1280px,100%);margin:auto;padding:22px 18px 42px}.top,.toolbar,.row,.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{margin-bottom:18px}.brand{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.18em}.brand span{color:var(--muted);font-weight:500}.tag{color:var(--teal);border:1px solid #79d4c555;border-radius:99px;padding:7px 11px;font-size:10px;letter-spacing:.16em}.toolbar{justify-content:flex-start;flex-wrap:wrap;margin-bottom:12px}.card{background:linear-gradient(145deg,#20343ff5,#182833f5);border:1px solid #334c56;border-radius:17px;padding:18px;box-shadow:0 18px 55px #0003}.button{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#ffffff0b;color:var(--ink);font-weight:700;text-decoration:none}.button.primary{background:var(--gold);border-color:var(--gold);color:#172126}.button:hover{border-color:var(--teal)}.status{min-height:18px;margin:0 0 12px;color:var(--teal);font-size:12px}.layout{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:14px;align-items:start}.list{display:grid;gap:7px}.person{width:100%;text-align:left;background:#101b2566;color:var(--ink);border:1px solid #ffffff1b;border-radius:10px;padding:10px 12px}.person.active{border-color:var(--gold);background:#f2c66d12}.person small{display:block;color:var(--muted);margin-top:4px}.panel-title{margin:0 0 12px;font-size:15px}.panel-title small{color:var(--muted);font-size:10px;font-weight:500}.field{display:grid;gap:5px;color:var(--muted);font-size:11px}.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;background:#101b25;color:var(--ink);padding:9px 10px}.field textarea{min-height:82px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12px}.check input{accent-color:var(--teal)}.hint{color:var(--muted);font-size:11px;line-height:1.7}.divider{height:1px;background:var(--line);margin:14px 0}.condition-list{display:grid;gap:7px}.condition-row{display:grid;grid-template-columns:minmax(140px,.65fr) minmax(0,1fr) auto;gap:7px;margin-top:7px}.condition-row select,.condition-row input{min-width:0;background:#101b25;border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px}.icon{border:0;background:transparent;color:var(--muted);padding:5px}.icon:hover{color:var(--gold)}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.preview-card{border:1px solid #ffffff1e;border-radius:12px;padding:10px;background:#101b2599}.preview-card h3{font-size:10px;letter-spacing:.13em;color:var(--gold);margin:0 0 8px}.chat-preview{min-height:90px;display:flex;align-items:center;gap:10px}.chat-preview img,.avatar-fallback{width:52px;height:52px;object-fit:cover;border-radius:50%;border:1px solid #d3b56c77;background:#243740;display:grid;place-items:center;color:var(--gold);font-size:20px}.portrait-preview{height:180px;position:relative;overflow:hidden;border-radius:8px;background:radial-gradient(ellipse,#31515b,#0c151c)}.portrait-preview>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.66}.portrait-preview>img.portrait{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94%;max-width:80%;object-fit:contain;filter:drop-shadow(0 5px 14px #0009)}.portrait-placeholder{position:absolute;inset:auto 0 13px;text-align:center;color:#d5dfd8;text-shadow:0 2px 6px #000;font:20px Georgia,serif}.file{display:none}.empty{padding:14px;border:1px dashed #4a626a;border-radius:10px;color:var(--muted);font-size:12px;text-align:center}.foot{color:#829394;text-align:center;font-size:10px;line-height:1.7;margin:15px 8px 0}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid2,.preview-grid{grid-template-columns:1fr}}@media(max-width:540px){.wrap{padding:14px 11px 30px}.condition-row{grid-template-columns:1fr 1fr}.condition-row input{grid-column:1}.condition-row .icon{grid-column:2;grid-row:1/3}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">CHRONOS <span>/ CHARACTER STUDIO</span></div><div class="tag">OFFLINE AUTHORING</div></header>
  <p class="hint" style="margin:-8px 0 14px"><a href="../../docs/story/シナリオ作成マニュアル.md">操作マニュアル・JSONの配置方法 ↗</a></p>
<div class="toolbar"><a class="button" href="./story-scenario-studio.html">← シナリオ編集へ</a><button id="addCharacter" class="button">＋ ネームドNPC</button><button id="importButton" class="button">JSONを読込</button><button id="exportButton" class="button primary">JSONを書き出す</button><input id="importFile" class="file" type="file" accept="application/json,.json"></div>
<p id="status" class="status" role="status">人物データを読み込み中…</p>
<div class="layout"><aside class="card"><h2 class="panel-title">人物 <small id="count"></small></h2><div id="people" class="list"></div></aside><section class="card"><div id="editor"></div></section></div>
<p class="foot">ネームドCPUとの共通ID・プロフィール連携を保ちつつ、ストーリー用アイコン、立ち絵、背景、登場条件を別設定します。Firebaseには接続しません。</p>
</main>
<script>
(()=>{'use strict';
const KEY='chronos_story_characters_draft_v1',$=id=>document.getElementById(id),esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const makeId=()=> 'story_npc_'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,10):Math.random().toString(36).slice(2,12));
const conditionTypes=[['event_completed','イベント完了'],['scenario_completed','シナリオ完了'],['achievement_earned','実績獲得']];
let data={format:'chronos-story-characters',schemaVersion:1,metadata:{title:'CHRONOS Story Characters',version:1},characters:[]},profiles=[],world=null,activeId='';
const active=()=>data.characters.find(x=>x.id===activeId);
function say(text,bad=false){$('status').textContent=text;$('status').style.color=bad?'var(--red)':'var(--teal)'}
function save(){data.metadata.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(data));say('人物データをブラウザー内に保存しました。')}catch{say('下書き保存に失敗しました。JSONを書き出して保管してください。',true)}}
function normalize(){data.characters=Array.isArray(data.characters)?data.characters:[];data.characters.forEach(c=>{c.eventTags=Array.isArray(c.eventTags)?c.eventTags:[];c.unlock=c.unlock||{operator:'all',conditions:[]};c.unlock.conditions=Array.isArray(c.unlock.conditions)?c.unlock.conditions:[];c.availableAtStart=Boolean(c.availableAtStart)});if(!activeId||!active())activeId=data.characters[0]?.id||''}
function renderList(){normalize();$('count').textContent=data.characters.length+'人';$('people').innerHTML=data.characters.map(c=>'<button class="person'+(c.id===activeId?' active':'')+'" data-person="'+esc(c.id)+'"><b>'+esc(c.name||'名称未設定')+'</b><small>'+esc(c.role||'役割未設定')+' · '+(c.cpuProfileId?'CPU連携あり':'ストーリー専用')+'</small></button>').join('')||'<div class="empty">ネームドNPCを追加してください。</div>';renderEditor()}
function renderConditions(c){const rows=c.unlock.conditions.map((item,i)=>'<div class="condition-row" data-condition="'+i+'"><select data-condition-field="type">'+conditionTypes.map(t=>'<option value="'+t[0]+'"'+(item.type===t[0]?' selected':'')+'>'+t[1]+'</option>').join('')+'</select><input data-condition-field="targetId" value="'+esc(item.targetId||'')+'" placeholder="イベント/シナリオ/実績ID"><button class="icon" data-action="remove-condition" data-index="'+i+'">削除</button></div>').join('');return '<label class="field">複数条件の扱い<select data-field="unlock.operator"><option value="all"'+(c.unlock.operator!=='any'?' selected':'')+'>すべて満たす（AND）</option><option value="any"'+(c.unlock.operator==='any'?' selected':'')+'>いずれかを満たす（OR）</option></select></label><div class="condition-list">'+(rows||'<p class="hint">条件なし。最初から登場可能にする場合は上のチェックを使います。</p>')+'</div><button class="button" data-action="add-condition">＋ 登場条件</button>'}
function renderEditor(){const host=$('editor'),c=active();if(!c){host.innerHTML='<div class="empty">人物を追加してください。</div>';return}const cpuOptions='<option value="">ストーリー専用（CPU対戦なし）</option>'+profiles.map(p=>'<option value="'+esc(p.id)+'"'+(c.cpuProfileId===p.id?' selected':'')+'>'+esc(p.name)+' · '+esc(p.id)+'</option>').join('');host.innerHTML='<div class="row"><h2 class="panel-title">人物設定 <small>'+esc(c.id)+'</small></h2><button class="icon" data-action="delete-person">この人物を削除</button></div><div class="grid2"><label class="field">人物ID（固定キー）<input data-field="id" value="'+esc(c.id)+'" spellcheck="false" readonly></label><label class="field">表示名<input data-field="name" value="'+esc(c.name||'')+'" maxlength="60"></label><label class="field">役割・人物区分<input data-field="role" value="'+esc(c.role||'')+'" placeholder="例: 王、案内人、対戦相手"></label><label class="field">既存CPUプロフィール<select data-field="cpuProfileId">'+cpuOptions+'</select><small class="hint">対戦CPUになる人物だけ既存プロフィールへ結びます。</small></label><label class="field">チャット用アイコンのパス<input data-field="chatIcon" value="'+esc(c.chatIcon||'')+'" placeholder="story/assets/人物-icon.png"></label><label class="field">ノベル用立ち絵のパス<input data-field="portrait" value="'+esc(c.portrait||'')+'" placeholder="story/assets/人物.png"></label><label class="field">標準背景のパス<input data-field="defaultBackground" value="'+esc(c.defaultBackground||'')+'" placeholder="story/assets/遺跡-background.jpg"></label><label class="field">イベントタグ（カンマ区切り）<input data-field="eventTagsText" value="'+esc((c.eventTags||[]).join(', '))+'" placeholder="案内人, 王族, 古代"></label><label class="field" style="grid-column:1/-1">制作者メモ<textarea data-field="notes" maxlength="1200">'+esc(c.notes||'')+'</textarea></label></div><label class="check" style="margin:12px 0"><input type="checkbox" data-field="availableAtStart"'+(c.availableAtStart?' checked':'')+'>ストーリー開始時から登場可能</label><div class="divider"></div><h3 class="panel-title">登場可能になる条件</h3><p class="hint">条件を追加すると「ストーリー開始時から登場可能」は自動でOFFになり、イベント・シナリオ・実績条件を満たした後に登場します。条件の評価はゲーム実行側で行います。</p>'+renderConditions(c)+'<div class="divider"></div><div class="preview-grid"><div class="preview-card"><h3>CHAT ICON</h3><div id="chatPreview" class="chat-preview"></div></div><div class="preview-card"><h3>VISUAL NOVEL PORTRAIT</h3><div id="portraitPreview" class="portrait-preview"></div></div></div>'}
function renderPreview(){const c=active();if(!c)return;const assetPreview=path=>{path=String(path||'').trim();return path&&!/^(?:https?:|data:|blob:|\/)/i.test(path)?'../../'+path:path};const icon=c.chatIcon?'<img src="'+esc(assetPreview(c.chatIcon))+'" alt="">':'<span class="avatar-fallback">'+esc((c.name||'?').slice(0,1))+'</span>'; $('chatPreview').innerHTML=icon+'<span><b>'+esc(c.name||'人物名')+'</b><br><small class="hint">'+esc(c.role||'チャット表示サンプル')+'</small></span>';let html='';if(c.defaultBackground)html+='<img class="bg" src="'+esc(assetPreview(c.defaultBackground))+'" alt="">';if(c.portrait)html+='<img class="portrait" src="'+esc(assetPreview(c.portrait))+'" alt="">';else html+='<span class="portrait-placeholder">'+esc(c.name||'立ち絵未設定')+'</span>'; $('portraitPreview').innerHTML=html}
function fieldInput(target){const c=active();if(!c)return;const path=target.dataset.field.split('.');let object=c;while(path.length>1)object=object[path.shift()];let value=target.type==='checkbox'?target.checked:target.value;if(target.dataset.field==='eventTagsText'){c.eventTags=value.split(',').map(x=>x.trim()).filter(Boolean);save();renderPreview();return}object[path[0]]=value;if(path[0]==='id'){const old=activeId;c.id=value;activeId=value;if(!value)activeId=old}save();renderPreview()}
function addCharacter(){const c={id:makeId(),name:'新しい人物',cpuProfileId:'',role:'ストーリーNPC',chatIcon:'',portrait:'',defaultBackground:'',eventTags:[],availableAtStart:true,unlock:{operator:'all',conditions:[]},notes:''};data.characters.push(c);activeId=c.id;save();renderList()}
function validate(){const issues=[],seen=new Set(),profileIds=new Set(profiles.map(x=>x.id));for(const c of data.characters){if(!c.id?.trim()||seen.has(c.id))issues.push('人物IDが空か重複しています。');seen.add(c.id);if(!c.name?.trim())issues.push(c.id+' の表示名が空です。');if(c.cpuProfileId&&!profileIds.has(c.cpuProfileId))issues.push(c.name+' が参照するCPUプロフィールがありません。');for(const rule of c.unlock.conditions||[])if(!rule.targetId?.trim())issues.push(c.name+' の登場条件にIDがありません。')}return issues}
function exportJson(){const issues=validate();if(issues.length){say(issues.join(' / '),true);return}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='story-characters.json';a.click();URL.revokeObjectURL(url);say('story-characters.jsonを書き出しました。')}
function importFile(file){const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(String(reader.result));if(d.format!=='chronos-story-characters'||d.schemaVersion!==1||!Array.isArray(d.characters))throw Error('story-characters形式ではありません。');data=d;activeId=data.characters[0]?.id||'';normalize();save();renderList();say('人物データを読み込みました。')}catch(e){say('読み込めませんでした: '+e.message,true)}};reader.readAsText(file)}
function click(event){const person=event.target.closest('[data-person]');if(person){activeId=person.dataset.person;renderList();return}const button=event.target.closest('[data-action]');if(!button)return;if(button.dataset.action==='add-condition'){const c=active();if(c){c.availableAtStart=false;c.unlock.conditions.push({type:'event_completed',targetId:''})}save();renderList()}else if(button.dataset.action==='remove-condition'){const c=active();c.unlock.conditions.splice(Number(button.dataset.index),1);save();renderList()}else if(button.dataset.action==='delete-person'){if(data.characters.length<2){say('最後の人物は削除できません。',true);return}if(confirm('この人物設定を削除しますか？')){data.characters=data.characters.filter(x=>x.id!==activeId);activeId=data.characters[0].id;save();renderList()}}}
document.addEventListener('input',e=>{if(e.target.dataset.field){fieldInput(e.target);return}if(e.target.dataset.conditionField){const c=active(),item=c?.unlock.conditions[Number(e.target.closest('[data-condition]').dataset.condition)];if(item){item[e.target.dataset.conditionField]=e.target.value;save()}}});document.addEventListener('change',e=>{if(e.target.dataset.field)fieldInput(e.target);else if(e.target.dataset.conditionField){const c=active(),item=c?.unlock.conditions[Number(e.target.closest('[data-condition]').dataset.condition)];if(item){item[e.target.dataset.conditionField]=e.target.value;save()}}});document.addEventListener('click',click);
$('addCharacter').addEventListener('click',addCharacter);$('exportButton').addEventListener('click',exportJson);$('importButton').addEventListener('click',()=>$('importFile').click());$('importFile').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});
Promise.allSettled([fetch('../data/story-characters.json',{cache:'no-cache'}).then(r=>r.json()),fetch('../../named-cpus.json',{cache:'no-cache'}).then(r=>r.json()),fetch('../data/story-world.json',{cache:'no-cache'}).then(r=>r.json())]).then(results=>{if(results[1].status==='fulfilled')profiles=Array.isArray(results[1].value.profiles)?results[1].value.profiles:[];if(results[2].status==='fulfilled')world=results[2].value;let loaded=false;try{const draft=localStorage.getItem(KEY);if(draft){const d=JSON.parse(draft);if(d.format==='chronos-story-characters')data=d;loaded=true}}catch{}if(!loaded&&results[0].status==='fulfilled'&&results[0].value.format==='chronos-story-characters')data=results[0].value;if(!data.characters.length&&profiles.length)data.characters=profiles.map(p=>({id:p.id,name:p.name,cpuProfileId:p.id,role:'ネームドCPU',chatIcon:'',portrait:'',defaultBackground:'',eventTags:['named-cpu'],availableAtStart:true,unlock:{operator:'all',conditions:[]},notes:''}));normalize();renderList();say(data.characters.length+'人の人物設定を読み込みました。'+(world?.achievements?.length||0)+'件の実績IDを参照できます。')}).catch(()=>{normalize();renderList();say('保存済み下書きを表示中。JSONを読み込むか新しい人物を追加できます。')});
})();
</script>
</body></html>
