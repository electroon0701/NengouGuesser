<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ネームドCPU管理</title>
<style>
:root{color-scheme:dark;--bg:#101b25;--panel:#182833;--ink:#f4f0e7;--muted:#a8b6b7;--gold:#f2c66d;--teal:#79d4c5;--line:#38505a;--red:#ff9a88}*{box-sizing:border-box}body{margin:0;padding:22px 14px 48px;background:radial-gradient(ellipse at 50% -20%,#2d4952 0,transparent 58%),var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}.wrap{width:min(1000px,100%);margin:auto}.card{background:linear-gradient(145deg,#20343f,#182833);border:1px solid #334c56;border-radius:18px;padding:clamp(16px,4vw,28px);box-shadow:0 18px 55px #0004}h1{font-size:clamp(23px,5vw,34px);line-height:1.3;margin:0 0 8px;color:var(--gold)}p{color:var(--muted)}button,.file-button{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#ffffff0c;color:var(--ink);font:inherit;font-weight:700;cursor:pointer}button.primary{border:0;background:var(--gold);color:#1b2427}.formrow{display:flex;gap:8px;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.file-button input{display:none}.status{min-height:24px;color:var(--teal);font-size:13px}.status.error{color:var(--red)}.profiles{display:grid;gap:13px;margin-top:16px}.profile{padding:15px;border:1px solid #ffffff24;border-radius:14px;background:#09141b66}.profile summary.profile-summary{display:flex;align-items:center;gap:12px;cursor:pointer;list-style:none}.profile summary.profile-summary::-webkit-details-marker{display:none}.profile summary.profile-summary:after{content:"設定を開く ▾";margin-left:auto;color:var(--teal);font-size:12px}.profile details[open] summary.profile-summary:after{content:"設定を閉じる ▴"}.profile-summary h2{font-size:17px;margin:0}.profile-body{padding-top:4px}.profile-head h2{font-size:17px;flex:1;margin:0}.preview{width:58px;height:58px;object-fit:cover;border-radius:50%;border:2px solid var(--gold);background:#0c151c}.preview.defeat{width:72px;height:72px;border-radius:12px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#0c151c;color:var(--ink);font:inherit}.field textarea{min-height:72px;resize:vertical}.traits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.trait{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:11px;color:var(--muted)}.trait input{grid-column:1/3;width:100%;accent-color:var(--teal)}.images{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.imagebox{padding:10px;border:1px solid #ffffff1c;border-radius:10px}.imagebox label{font-size:12px;color:var(--muted)}.imagebox input{display:block;margin:6px 0;max-width:100%}.imagepreview{display:flex;align-items:center;gap:10px;min-height:78px}.imagepreview img{max-width:120px;max-height:110px;object-fit:contain;border-radius:9px;background:#0c151c}.remove{color:var(--red)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:300px;overflow:auto;background:#0c151c;border:1px solid var(--line);padding:12px;border-radius:10px;font:12px/1.5 ui-monospace,monospace}.muted{color:var(--muted);font-size:12px}@media(max-width:680px){.fields{grid-template-columns:1fr 1fr}.traits{grid-template-columns:repeat(2,1fr)}.images{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><section class="card">
<h1>ネームドCPU管理</h1>
<p>現在の <code>named-cpus.json</code> を読み込み、キャラクターの追加・編集・削除ができます。アイコン、召喚時の演出、敗北・勝利時の絵とセリフも登録できます。画像は小さくしてJSON内に保存し、Firebaseには送信しません。</p>
<div class="toolbar"><label class="file-button">JSONを読み込む<input id="load" type="file" accept=".json,application/json"></label><button id="add">＋ キャラクターを追加</button><button id="export" class="primary">named-cpus.jsonを書き出す</button></div>
<div id="status" class="status" role="status">同じフォルダーの named-cpus.json を読み込みます。</div><div id="profiles" class="profiles"></div>
<section style="margin-top:20px"><h2 style="font-size:16px">書き出し内容</h2><pre id="output"></pre></section>
<p class="muted">書き出したJSONをこのHTMLと同じフォルダーの named-cpus.json に置き換えると、ゲームに反映されます。画像データはJSONに含まれます。</p>
</section></main>
<script>
(()=>{
 const defaults={memory:.5,intuition:.5,aggression:.43,caution:.55,curiosity:.52,thrift:.56,variability:.44,shopping:.48,strategy:.5};
 const labels={beginner:"初学者",exam_candidate:"受験生",major:"専攻生",historian:"歴史学者"};
 const traits=[['memory','記憶力'],['intuition','時代感覚'],['aggression','攻め気'],['caution','慎重さ'],['curiosity','好奇心'],['thrift','温存傾向'],['variability','迷い'],['shopping','買い物傾向'],['strategy','戦略性']];
 const $=id=>document.getElementById(id);let profiles=[];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function clean(p){return {id:String(p.id||''),name:String(p.name||''),level:labels[p.level]?p.level:'beginner',personality:{...defaults,...(p.personality||{})},...(p.voiceStyle?{voiceStyle:String(p.voiceStyle)}:{}),...(p.icon||p.portrait?{icon:String(p.icon||p.portrait)}:{}),...(p.defeatImage?{defeatImage:String(p.defeatImage)}:{}),...(p.defeatLine?{defeatLine:String(p.defeatLine)}:{}),...(p.victoryImage?{victoryImage:String(p.victoryImage)}:{}),...(p.victoryLine?{victoryLine:String(p.victoryLine)}:{}),...(p.itemUseLine?{itemUseLine:String(p.itemUseLine)}:{}),summonEffect:['none','evil','sacred','party'].includes(p.summonEffect)?p.summonEffect:'sacred',...(p.summonCodeHash?{summonCodeHash:String(p.summonCodeHash)}:{})}}
 function data(){return {schemaVersion:1,profiles:profiles.map(clean)}}
 function updateOutput(){const text=JSON.stringify(data(),null,2)+'\n';$('output').textContent=text;return text}
 function status(text,error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'')}
 function render(){ $('profiles').innerHTML=profiles.map((p,i)=>`<article class="profile" data-index="${i}"><details><summary class="profile-summary"><img class="preview" src="${esc(p.icon||p.portrait||'')}" alt="" onerror="this.style.visibility='hidden'"><div><h2>${esc(p.name||`新しいCPU ${i+1}`)}</h2><span class="muted">${esc(p.id||'ID未設定')}</span></div></summary><div class="profile-body"><div class="fields"><label class="field">ID（英数字・_・-）<input data-key="id" value="${esc(p.id)}" maxlength="48"></label><label class="field">名前（12文字以内）<input data-key="name" value="${esc(p.name)}" maxlength="12"></label><label class="field">強さ<select data-key="level">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${p.level===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">キャラクターの口調<input data-key="voiceStyle" value="${esc(p.voiceStyle||'')}"></label><label class="field">召喚時の演出<select data-key="summonEffect"><option value="none" ${p.summonEffect==='none'?'selected':''}>演出なし</option><option value="evil" ${p.summonEffect==='evil'?'selected':''}>邪悪</option><option value="sacred" ${p.summonEffect==='sacred'?'selected':''}>神聖</option><option value="party" ${p.summonEffect==='party'?'selected':''}>パリピ</option></select></label></div><div class="traits">${traits.map(([key,label])=>`<label class="trait"><span>${label}</span><output>${Math.round((Number(p.personality?.[key]??defaults[key]))*100)}</output><input type="range" min="0" max="1" step="0.01" data-trait="${key}" value="${esc(p.personality?.[key]??defaults[key])}"></label>`).join('')}</div><div class="images"><div class="imagebox"><label>参加者一覧に表示するアイコン（任意）</label><input type="file" accept="image/*" data-image="icon"><div class="imagepreview">${p.icon||p.portrait?`<img src="${esc(p.icon||p.portrait)}" alt="アイコン">`: '<span class="muted">画像未設定</span>'}<button data-clear="icon">画像を外す</button></div></div><div class="imagebox"><label>敗北時の絵（任意）</label><input type="file" accept="image/*" data-image="defeatImage"><div class="imagepreview">${p.defeatImage?`<img src="${esc(p.defeatImage)}" alt="敗北時の絵">`:'<span class="muted">画像未設定</span>'}<button data-clear="defeatImage">画像を外す</button></div></div><div class="imagebox"><label>勝利時の絵（任意）</label><input type="file" accept="image/*" data-image="victoryImage"><div class="imagepreview">${p.victoryImage?`<img src="${esc(p.victoryImage)}" alt="勝利時の絵">`: '<span class="muted">画像未設定</span>'}<button data-clear="victoryImage">画像を外す</button></div></div></div><label class="field" style="margin-top:10px">敗北時の特殊セリフ<textarea data-key="defeatLine" maxlength="240" placeholder="例：今回は私の負けね。次は勝たせてもらうわ。">${esc(p.defeatLine||'')}</textarea></label><label class="field" style="margin-top:10px">勝利時のコメント<textarea data-key="victoryLine" maxlength="240" placeholder="例：歴史は、勝者の名を記すものよ。">${esc(p.victoryLine||'')}</textarea></label><label class="field" style="margin-top:10px">アイテム使用時のセリフ<textarea data-key="itemUseLine" maxlength="240" placeholder="例：この一手で流れを変える！">${esc(p.itemUseLine||'')}</textarea></label><div class="imagebox" style="margin-top:10px"><label>召喚コード（入力したコード自体は保存せず、照合用ハッシュのみJSONへ記録）</label><div class="formrow"><input class="textinput" type="password" autocomplete="new-password" data-summon-code placeholder="新しいコードを入力"><button type="button" data-set-code="${i}">コードを設定</button></div><span class="muted">${p.summonCodeHash?'コード設定済み。再入力すると変更できます。':'コード未設定。未設定のキャラクターは通常選択できます。'}</span><button type="button" data-clear="summonCodeHash">コードを解除</button></div></div></details><button class="remove" data-remove="${i}">このキャラクターを削除</button></article>`).join('');updateOutput() }
 async function loadJson(file){const d=JSON.parse(await file.text());if(d.schemaVersion!==1||!Array.isArray(d.profiles))throw Error('schemaVersion: 1 と profiles 配列が必要です。');profiles=d.profiles.map(clean);if(profiles.length>100)throw Error('一度に編集できるキャラクターは100人までです。');render();status(`${profiles.length}人のネームドCPUを読み込みました。`)}
 function validate(){const ids=new Set();for(const [i,p] of profiles.entries()){if(!/^[a-zA-Z0-9_-]{1,48}$/.test(p.id))throw Error(`${i+1}人目: IDは英数字・_・-の1〜48文字にしてください。`);if(ids.has(p.id))throw Error(`ID「${p.id}」が重複しています。`);ids.add(p.id);if(!p.name.trim()||p.name.length>12)throw Error(`${p.name||`${i+1}人目`}: 名前は1〜12文字です。`);if(!labels[p.level])throw Error(`${p.name}: 強さを選んでください。`)}}
 async function imageData(file,max){const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const x=new Image();x.onload=()=>resolve(x);x.onerror=reject;x.src=raw});const scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.82)}
 $('profiles').addEventListener('input',e=>{const card=e.target.closest('.profile');if(!card)return;const i=Number(card.dataset.index),key=e.target.dataset.key,trait=e.target.dataset.trait;if(key){profiles[i][key]=e.target.value;if(key==='name'||key==='id')card.querySelector('.profile-summary h2').textContent=profiles[i].name||`新しいCPU ${i+1}`;updateOutput()}if(trait){profiles[i].personality[trait]=Number(e.target.value);e.target.previousElementSibling.textContent=Math.round(Number(e.target.value)*100);updateOutput()}});
 $('profiles').addEventListener('change',async e=>{const card=e.target.closest('.profile');if(!card)return;const i=Number(card.dataset.index);if(e.target.matches('[data-key="level"]')){profiles[i].level=e.target.value;updateOutput()}if(e.target.matches('[data-key="summonEffect"]')){profiles[i].summonEffect=e.target.value;updateOutput()}if(e.target.matches('[data-image]')){const file=e.target.files?.[0];if(!file)return;try{profiles[i][e.target.dataset.image]=await imageData(file,e.target.dataset.image==='icon'?128:480);if(e.target.dataset.image==='icon')profiles[i].icon=profiles[i].icon;render();status('画像を登録しました。JSONに含めて書き出せます。')}catch(err){status('画像を読み込めませんでした。',true)}}});
 $('profiles').addEventListener('click',async e=>{const card=e.target.closest('.profile');if(!card)return;const i=Number(card.dataset.index);if(e.target.matches('[data-remove]')){profiles.splice(i,1);render();status('キャラクターを削除しました。')}if(e.target.matches('[data-clear]')){delete profiles[i][e.target.dataset.clear];render();status('画像または召喚コードを解除しました。')}if(e.target.matches('[data-set-code]')){try{const code=card.querySelector('[data-summon-code]').value.normalize('NFKC').trim();if(!code)throw Error('召喚コードを入力してください。');if(!crypto?.subtle)throw Error('HTTPSのページで開いてください。');const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(code));profiles[i].summonCodeHash=Array.from(new Uint8Array(digest),v=>v.toString(16).padStart(2,'0')).join('');render();status('召喚コードのハッシュを設定しました。コード自体はJSONに保存されません。')}catch(err){status(err.message,true)}}});
 $('add').onclick=()=>{profiles.push({id:`new_cpu_${profiles.length+1}`,name:'新しいCPU',level:'beginner',personality:{...defaults}});render();status('新しいキャラクターを追加しました。')};
 $('load').onchange=async e=>{try{if(e.target.files?.[0])await loadJson(e.target.files[0])}catch(err){status(err.message,true)}};
 $('export').onclick=()=>{try{validate();const blob=new Blob([updateOutput()],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='named-cpus.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status(`${profiles.length}人分を書き出しました。named-cpus.json を同じフォルダーへ配置してください。`)}catch(err){status(err.message,true)}};
 fetch('./named-cpus.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('既存JSONを取得できません');return r.json()}).then(d=>{if(d.schemaVersion!==1||!Array.isArray(d.profiles))throw Error('JSON形式が違います');profiles=d.profiles.map(clean);render();status(`${profiles.length}人の既存キャラクターを読み込みました。編集して追加できます。`)}).catch(()=>{profiles=[];render();status('既存JSONを読み込めませんでした。「JSONを読み込む」からファイルを指定してください。',true)});
})();
</script></body></html>
