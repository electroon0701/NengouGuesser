<!doctype html>
<html lang="ja">
<head>

  <meta name="theme-color" content="#101b25"><title>Chronos Online｜世界史年号当て</title>
  <style>

    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -25%,#2d4952 0,transparent 58%),var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(880px,100%);margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:700}.tag{border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;padding:7px 12px}.intro{text-align:center;margin:8px 0 20px}.intro h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(28px,6vw,40px);font-weight:500;margin:0 0 6px}.intro p{color:var(--muted);font-size:14px;margin:0}.card{background:linear-gradient(145deg,rgba(32,52,63,.97),rgba(24,40,51,.97));border:1px solid #334c56;border-radius:20px;padding:clamp(19px,4vw,32px);box-shadow:0 20px 60px #0003}.hidden{display:none!important}h2{margin:0 0 8px}.muted{color:var(--muted)}.formrow{display:flex;gap:9px;margin:12px 0}.textinput{width:100%;min-width:0;background:#101b25;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink)}.primary,.secondary{border:0;border-radius:11px;padding:12px 17px;font-weight:700}.primary{background:var(--gold);color:#1b2427}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#ffffff0d;color:var(--ink);border:1px solid var(--line)}.joinrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:9px}.settinggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0 8px}.settinggrid label{display:grid;gap:6px;color:var(--muted);font-size:13px}.settinggrid select:disabled{opacity:.7}.divider{height:1px;background:var(--line);margin:20px 0}.notice{font-size:13px;color:var(--muted);line-height:1.7}.error{color:#ffb4a6;white-space:pre-wrap;font-size:13px;margin-top:12px}.roomtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.code{font:bold 23px ui-monospace,monospace;color:var(--gold);letter-spacing:.14em}.players{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.player{background:#ffffff0a;border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.meta{color:var(--muted);font-size:13px}.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}.timer.urgent{color:var(--red)}.progress{height:5px;background:#30434b;border-radius:9px;overflow:hidden;margin:12px 0 22px}.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}.question{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,5vw,32px);line-height:1.5;text-align:center;min-height:95px;display:grid;place-items:center;margin:0 0 5px}.axis-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.axis{position:relative;height:70px;padding:0 5px}.axis input{appearance:none;width:100%;height:5px;border-radius:10px;background:linear-gradient(90deg,#71807e,#d3b56c);outline:none;margin:28px 0}.axis input::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--gold);border:4px solid #fff3;box-shadow:0 0 0 2px var(--gold)}.axis input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:4px solid #fff3;box-shadow:0 0 0 2px var(--gold)}.ticks{display:flex;justify-content:space-between;position:absolute;left:0;right:0;top:45px;color:#87999b;font-size:9px;pointer-events:none}.ticks span{transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:none}.answerline{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px auto 18px}.answerline button{border:1px solid var(--line);color:var(--ink);background:#ffffff08;border-radius:10px;min-width:40px;height:38px;font-size:20px}.answerline output{font-size:21px;font-weight:650;min-width:116px;text-align:center}.center{text-align:center}.small{font-size:12px}.resultbox{background:#ffffff08;border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}.answerlist{display:grid;gap:7px;margin-top:12px}.answeritem{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff13;font-size:13px}.good{color:var(--teal)}.foot{text-align:center;color:#829394;font-size:11px;line-height:1.7;margin:17px 8px 0}@media(max-width:560px){.joinrow{grid-template-columns:1fr 1fr}.joinrow button{grid-column:1/-1}.settinggrid{grid-template-columns:1fr}.formrow{flex-direction:column}.card{border-radius:17px}.question{min-height:110px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand">CHRONOS <span style="color:#a8b6b7;font-weight:400">/ ONLINE</span></div><div class="tag">友達と対戦</div></header>
  <section class="intro"><h1>年号覚えなくちゃ。</h1><p>出来事がいつ起きたかを回答し、その近さで競います。</p></section>
  <section id="setup" class="card"><h2>オンライン対戦を始める</h2><p class="notice">表示名を決めて、部屋を作るか、友達の部屋コードで参加してください。アカウント登録は不要です。</p>
    <label class="small muted" for="name">あなたの表示名</label><div class="formrow"><input class="textinput" id="name" maxlength="12" placeholder="例：パブロ・ディエゴ・ホセ・フランシスコ・デ・パウラ・ホアン・ネポムセーノ・マリーア・デ・ロス・レメディオス・クリスピーン・クリスピアーノ・デ・ラ・サンティシマ・トリニダード・ルイス・イ・ピカソ" autocomplete="nickname"></div>
    <div class="joinrow"><button class="primary" id="create" disabled>部屋を作る</button><input class="textinput" id="roomInput" maxlength="6" placeholder="6文字のコード" autocomplete="off"><button class="secondary" id="join" disabled>コードで参加</button></div>
    <p id="bankStatus" class="muted small"></p><div id="setupError" class="error"></div>
    <div class="divider"></div><p class="notice">※この画面を遊ぶ前に、ガイドの手順でFirebase設定値を入力してください。友達と試すための試作版です。</p>
  </section>
  <section id="lobby" class="card hidden"><div class="roomtop"><div><div class="meta">部屋コード（友達に共有）</div><div class="code" id="roomCode"></div></div><button class="secondary" id="copy">コードをコピー</button></div><div class="divider"></div><div id="hostSettings" class="settinggrid"><label>問題数<select class="textinput" id="questionCount"></select></label><label>問題の種別<select class="textinput" id="categoryFilter"></select></label></div><p id="settingsSummary" class="muted small"></p><div class="row"><strong>参加者</strong><span class="meta" id="playerCount"></span></div><div class="players" id="players"></div><p class="notice" id="lobbyMessage"></p><div class="center"><button class="primary hidden" id="start">ゲーム開始（1〜5人）</button></div><div id="lobbyError" class="error"></div><div class="center" style="margin-top:14px"><button class="secondary" id="leave">部屋を出る</button></div></section>
  <section id="game" class="card hidden"><div class="row"><div class="meta" id="roundLabel"></div><div class="timer" id="timer"></div></div><div class="progress"><i id="progress"></i></div><h2 class="question" id="question"></h2><p class="center muted small" id="gameMessage"></p><div class="axis-head"><span>紀元前2000年</span><span>現代</span></div><div class="axis"><input id="slider" type="range" min="0" max="10000" step="1" value="0" aria-label="回答する年"><div class="ticks"><span>紀元前2000</span><span>紀元前1</span><span>1000</span><span>1800</span><span>現代</span></div></div><div class="answerline"><button id="minus" aria-label="1年戻る">−</button><output id="chosenYear"></output><button id="plus" aria-label="1年進む">＋</button></div><div id="datePicker" class="settinggrid hidden"><label>月<select class="textinput" id="guessMonth"></select></label><label>日<select class="textinput" id="guessDay"></select></label></div><p id="dateHint" class="center muted small hidden">この問題は月・日まで選べます。</p><div class="center"><button class="primary" id="submit">この年に回答する</button></div><div class="resultbox hidden" id="roundResult"></div></section>
  <section id="finished" class="card hidden"></section>
  <p class="foot">最初のオンライン試作です。問題の正解はゲーム画面のファイルに含まれるため、厳密な不正対策はありません。</p>
</main>
<script type="module">
  // Firebaseプロジェクトの設定値は入力済みです。別のプロジェクトを使う場合のみ変更します。
  const firebaseConfig = {
    apiKey: "AIzaSyDnjLOsEYsmTK0WykkyorzUUbGC4-Qarlc",
    authDomain: "nengouguesser.firebaseapp.com",
    databaseURL: "https://nengouguesser-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nengouguesser",
    storageBucket: "nengouguesser.firebasestorage.app",
    messagingSenderId: "992435991923",
    appId: "1:992435991923:web:230539c977c42afe8ac106"
  };
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import { getDatabase, ref, get, set, update, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

  let BANK=[]; // 問題データは同じフォルダの questions.json から読み込みます。
  const MIN=-1999,MAX=new Date().getFullYear(),BREAKS=[MIN,0,1000,1800,MAX],WEIGHTS=[.15,.18,.27,.40];
  const $=id=>document.getElementById(id),views=["setup","lobby","game","finished"];
  let app,auth,db,uid=null,room=null,roomRef=null,isHost=false,meta=null,playerData={},answers={},roundsAnswers={},guess=2025,guessMonth=1,guessDay=1,currentQuestion=null,dateQuestionId=null,timerJob=null,transitionJob=null,working=false,lastTransition="",unsubscribers=[],answerUnsubscribe=null,answerListenerRound=null;
  const show=(id)=>views.forEach(x=>$(x).classList.toggle("hidden",x!==id));
  const displayYear=y=>y<=0?`紀元前${1-y}年`:`${y}年`;
  const answerYear=q=>q.era==="BCE"?1-q.year:q.year;
  const eventYear=q=>{const y=q.era==="BCE"?`紀元前${q.year}年`:`${q.year}年`;return hasExactDate(q)?`${y}${q.month}月${q.day}日`:y};
  function fromPos(value){let p=value/10000,acc=0;for(let i=0;i<WEIGHTS.length;i++){let w=WEIGHTS[i];if(p<=acc+w||i===WEIGHTS.length-1){let t=Math.max(0,Math.min(1,(p-acc)/w));return Math.round(BREAKS[i]+t*(BREAKS[i+1]-BREAKS[i]))}acc+=w}return MAX}
  function toPos(y){for(let i=0;i<WEIGHTS.length;i++){if(y<=BREAKS[i+1]||i===WEIGHTS.length-1){let acc=WEIGHTS.slice(0,i).reduce((a,b)=>a+b,0),t=(y-BREAKS[i])/(BREAKS[i+1]-BREAKS[i]);return Math.round((acc+Math.max(0,Math.min(1,t))*WEIGHTS[i])*10000)}}return 10000}
  function hasExactDate(q){return Number.isInteger(q?.month)&&Number.isInteger(q?.day)}
  function daysInMonth(year,month){const d=new Date(0);d.setUTCHours(0,0,0,0);d.setUTCFullYear(year,month,0);return d.getUTCDate()}
  function dateOrdinal(year,month,day){const d=new Date(0);d.setUTCHours(0,0,0,0);d.setUTCFullYear(year,month-1,day);return Math.floor(d.getTime()/86400000)}
  function syncDayOptions(){if(!currentQuestion||!hasExactDate(currentQuestion))return;const monthSelect=$("guessMonth"),daySelect=$("guessDay");let maxMonth=guess===MAX?new Date().getMonth()+1:12;monthSelect.innerHTML=Array.from({length:maxMonth},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join("");if(guessMonth>maxMonth)guessMonth=maxMonth;monthSelect.value=String(guessMonth);let maxDay=daysInMonth(guess,guessMonth);if(guess===MAX&&guessMonth===new Date().getMonth()+1)maxDay=Math.min(maxDay,new Date().getDate());daySelect.innerHTML=Array.from({length:maxDay},(_,i)=>`<option value="${i+1}">${i+1}日</option>`).join("");if(guessDay>maxDay)guessDay=maxDay;daySelect.value=String(guessDay)}
  function setGuess(y){guess=Math.max(MIN,Math.min(MAX,Math.round(y)));$("slider").value=toPos(guess);$("chosenYear").textContent=displayYear(guess);syncDayOptions()}
  function formatAnswer(a,q){if(hasExactDate(q)&&Number.isInteger(a?.month)&&Number.isInteger(a?.day))return `${displayYear(a.year)}${a.month}月${a.day}日`;return displayYear(a.year)}
  function differenceFor(a,q){if(hasExactDate(q)&&Number.isInteger(a?.month)&&Number.isInteger(a?.day))return {value:Math.abs(dateOrdinal(a.year,a.month,a.day)-dateOrdinal(answerYear(q),q.month,q.day)),unit:"日"};return {value:Math.abs(a.year-answerYear(q)),unit:"年"}}
  function scoreFor(a,q){const d=differenceFor(a,q);return Math.round(1000/(1+d.value/(d.unit==="日"?36500:100)))}
  function validConfig(){return !JSON.stringify(firebaseConfig).includes("ここに")}
  function matchingQuestions(category){return category==="ALL"?BANK:BANK.filter(q=>q.category===category)}
  function validQuestionCount(category,count){return matchingQuestions(category).length>=count}
  function populateQuestionSettings(preferredCount=5,preferredCategory="ALL"){const categorySelect=$("categoryFilter"),countSelect=$("questionCount");const categories=[...new Set(BANK.map(q=>q.category))].filter(c=>matchingQuestions(c).length>=5).sort((a,b)=>a.localeCompare(b,"ja"));categorySelect.innerHTML=[new Option("すべての種別","ALL"),...categories.map(c=>new Option(c,c))].map(o=>o.outerHTML).join("");categorySelect.value=categories.includes(preferredCategory)?preferredCategory:"ALL";const available=[5,10,15].filter(n=>validQuestionCount(categorySelect.value,n));countSelect.innerHTML=available.map(n=>`<option value="${n}">${n}問</option>`).join("");if(!available.includes(preferredCount))preferredCount=available.includes(5)?5:(available[available.length-1]||5);countSelect.value=String(preferredCount);$("start").disabled=!available.length;$("settingsSummary").textContent=`この種別の問題：${matchingQuestions(categorySelect.value).length}件`}
  async function saveLobbySettings(){if(!isHost||!room||meta?.status!=="lobby")return;const count=Number($("questionCount").value),category=$("categoryFilter").value;if(!validQuestionCount(category,count))return;const ids=shuffle(matchingQuestions(category)).slice(0,count).map(q=>q.id);try{await update(ref(db,`rooms/${room}/meta`),{questionCount:count,selectedCategory:category,questionOrder:ids})}catch(e){errorInLobby(e)}}
  async function loadQuestionBank(){try{const response=await fetch("./questions.json",{cache:"no-store"});if(!response.ok)throw new Error(`questions.jsonを読み込めませんでした（HTTP ${response.status}）。index.htmlと同じ場所に置いてください。`);const rows=await response.json();if(!Array.isArray(rows)||rows.length<5)throw new Error("問題はJSON配列で5件以上必要です。");const ids=new Set();for(const [i,q] of rows.entries()){if(!q||typeof q.id!=="string"||!q.id.trim()||ids.has(q.id))throw new Error(`${i+1}行目：idが空か重複しています。`);if(typeof q.event!=="string"||!q.event.trim())throw new Error(`${i+1}行目：event（出来事）が空です。`);if(!["BCE","CE"].includes(q.era))throw new Error(`${i+1}行目：eraはBCEまたはCEにしてください。`);if(!Number.isInteger(q.year)||q.year<1||(q.era==="BCE"&&q.year>2000)||(q.era==="CE"&&q.year>MAX))throw new Error(`${i+1}行目：yearは範囲内の1以上の整数にしてください。`);if((q.month==null)!==(q.day==null))throw new Error(`${i+1}行目：月日を登録する場合はmonthとdayの両方が必要です。`);if(q.month!=null&&!validCalendarDate(q.era==="BCE"?1-q.year:q.year,q.month,q.day))throw new Error(`${i+1}行目：month/dayが実在する日付ではありません。`);q.category=typeof q.category==="string"&&q.category.trim()?q.category.trim():"世界史";ids.add(q.id)}BANK=rows;populateQuestionSettings();$("bankStatus").textContent=`問題 ${BANK.length} 件を読み込みました。`;$("create").disabled=false;$("join").disabled=false}catch(e){$("setupError").textContent=`問題データを読み込めません。${e.message}`}}
  async function connect(){if(!validConfig())throw new Error("Firebaseの設定値がまだ入っていません。ガイドの「コードの設定」を先に行ってください。");if(!app){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app)}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid}
  function cleanName(){let s=$("name").value.trim().replace(/[<>]/g,"").slice(0,12);if(!s)throw new Error("表示名を入力してください。");return s}
  function code(){return Math.random().toString(36).slice(2,8).toUpperCase().replace(/[IO]/g,"X")}
  function setUrlRoom(c){const u=new URL(location.href);u.searchParams.set("room",c);history.replaceState({},"",u)}
  function listen(c){unsubscribers.forEach(stop=>stop());unsubscribers=[];if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;room=c;roomRef=ref(db,`rooms/${c}`);roundsAnswers={};unsubscribers.push(onValue(ref(db,`rooms/${c}/meta`),snap=>{const previous=meta;meta=snap.val();if(!meta){exitRoom("部屋が見つからないか、終了しました。");return}if(previous&&previous.roundIndex!==meta.roundIndex)answers=roundsAnswers[meta.roundIndex]||{};renderState();const canRead=isHost||meta.status==="reveal"||meta.status==="finished";if(!canRead){if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;return}if(answerListenerRound!==meta.roundIndex){if(answerUnsubscribe)answerUnsubscribe();answerListenerRound=meta.roundIndex;const round=meta.roundIndex;answerUnsubscribe=onValue(ref(db,`rooms/${c}/answers/${round}`),s=>{roundsAnswers[round]=s.val()||{};if(meta?.roundIndex===round)answers=roundsAnswers[round];renderState();checkAllAnswered()},err=>errorInLobby(err))}},err=>errorInLobby(err)));unsubscribers.push(onValue(ref(db,`rooms/${c}/players`),snap=>{playerData=snap.val()||{};renderPlayers();checkAllAnswered()},err=>errorInLobby(err)));renderState()}
  async function createRoom(){if(working)return;working=true;$("setupError").textContent="";try{const name=cleanName();await connect();let made=false,c="",hostMeta;for(let i=0;i<8&&!made;i++){c=code();hostMeta={hostUid:uid,status:"lobby",roundIndex:0,roundKey:"0",questionCount:5,selectedCategory:"ALL",questionOrder:shuffle(BANK).slice(0,5).map(q=>q.id),deadline:0,createdAt:Date.now()};const result=await runTransaction(ref(db,`rooms/${c}/meta`),current=>current===null?hostMeta:undefined);made=result.committed}if(!made)throw new Error("部屋コードを作れませんでした。もう一度お試しください。");isHost=true;await enterPlayer(c,name);setUrlRoom(c)}catch(e){$("setupError").textContent=errorText(e)}finally{working=false}}
  async function joinRoom(){if(working)return;working=true;$("setupError").textContent="";try{const name=cleanName(),c=$("roomInput").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))throw new Error("部屋コードは6文字で入力してください。");await connect();const s=await get(ref(db,`rooms/${c}/meta`)),m=s.val();if(!m)throw new Error("部屋が見つかりません。コードを確認してください。");if(m.status!=="lobby")throw new Error("この部屋はすでにゲーム中です。");isHost=false;await enterPlayer(c,name);setUrlRoom(c)}catch(e){$("setupError").textContent=errorText(e)}finally{working=false}}
  async function enterPlayer(c,name){await set(ref(db,`rooms/${c}/players/${uid}`),{name,joinedAt:Date.now()});onDisconnect(ref(db,`rooms/${c}/players/${uid}`)).remove();$("roomCode").textContent=c;$("lobbyError").textContent="";show("lobby");listen(c)}
  function renderPlayers(){if(!room)return;const list=Object.entries(playerData);$("players").innerHTML=list.map(([id,p])=>`<span class="player">${escapeHtml(p.name||"プレイヤー")}${id===meta?.hostUid?" · ホスト":""}</span>`).join("")||"<span class='muted small'>参加者を待っています…</span>";$("playerCount").textContent=`${list.length}人`;$("start").classList.toggle("hidden",!(isHost&&meta?.status==="lobby"));$("hostSettings").classList.toggle("hidden",!isHost||meta?.status!=="lobby");if(meta?.status==="lobby"){const count=meta.questionCount||Math.max(5,meta.questionOrder?.length||5),category=meta.selectedCategory||"ALL";populateQuestionSettings(count,category);$("questionCount").disabled=!isHost;$("categoryFilter").disabled=!isHost;$("settingsSummary").textContent=`設定：${Number($("questionCount").value)||count}問・${category==="ALL"?"すべての種別":category}（対象 ${matchingQuestions(category).length}件）`}$("lobbyMessage").textContent=isHost?"一人でも開始できます。友達と遊ぶ場合は、コードを共有して参加者を待ってください。":"ホストがゲームを開始するまでお待ちください。"}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function errorText(e){return e?.code?`${e.message||e.code}\nエラーコード: ${e.code}`:(e?.message||String(e))}
  function errorInLobby(e){$("lobbyError").textContent=errorText(e)}
  async function startGame(){if(!isHost||Object.keys(playerData).length<1)return;const count=Number($("questionCount").value),category=$("categoryFilter").value;if(!validQuestionCount(category,count)){errorInLobby("この種別の問題数が足りません。");return}const ids=shuffle(matchingQuestions(category)).slice(0,count).map(q=>q.id),now=Date.now();try{await update(ref(db,`rooms/${room}/meta`),{questionCount:count,selectedCategory:category,questionOrder:ids,status:"answering",roundIndex:0,roundKey:"0",deadline:now+30000})}catch(e){errorInLobby(e)}}
  function renderState(){if(!meta||!room)return;$("roomCode").textContent=room;renderPlayers();if(meta.status==="lobby"){show("lobby");return}if(meta.status==="finished"){show("finished");renderFinal();return}show("game");const total=meta.questionCount||meta.questionOrder?.length||5,q=BANK.find(x=>x.id===meta.questionOrder[meta.roundIndex]);if(!q)return;currentQuestion=q;if(dateQuestionId!==q.id){dateQuestionId=q.id;guessMonth=1;guessDay=1}const exactDate=hasExactDate(q);$("datePicker").classList.toggle("hidden",!exactDate);$("dateHint").classList.toggle("hidden",!exactDate);$("roundLabel").textContent=`第${meta.roundIndex+1}問 / ${total}問`;$("progress").style.width=`${((meta.roundIndex+1)/total)*100}%`;$("question").textContent=q.event;const submitted=answers?.[uid];$("submit").disabled=Boolean(submitted)||meta.status!=="answering";$("slider").disabled=$("submit").disabled;$("minus").disabled=$("submit").disabled;$("plus").disabled=$("submit").disabled;$("guessMonth").disabled=$("submit").disabled;$("guessDay").disabled=$("submit").disabled;$("submit").textContent=exactDate?"この日付で回答する":"この年に回答する";$("gameMessage").textContent=meta.status==="answering"?(submitted?"あなたの回答を記録しました。他の人の回答を待っています。":`回答した人数: ${Object.keys(answers||{}).length} / ${Object.keys(playerData).length}人`):"回答を締め切りました。結果を確認してください。";if(meta.status==="reveal")renderRoundResult(q);else $("roundResult").classList.add("hidden");setGuess(guess);startTimer()}
  function startTimer(){clearInterval(timerJob);timerJob=setInterval(()=>{if(!meta||meta.status!=="answering"){$("timer").textContent="";clearInterval(timerJob);return}let left=Math.max(0,Math.ceil((meta.deadline-Date.now())/1000));$("timer").textContent=`残り ${left} 秒`;$("timer").classList.toggle("urgent",left<=5);if(left===0&&isHost)revealRound()},200)}
  function renderRoundResult(q){const entries=Object.entries(answers||{});$("roundResult").classList.remove("hidden");$("roundResult").innerHTML=`<div class="good"><b>正解：${eventYear(q)}</b></div><div class="muted small">${escapeHtml(q.note)}</div><div class="answerlist">${entries.map(([id,a])=>{const p=playerData[id]?.name||"退出したプレイヤー",points=scoreFor(a,q),diff=differenceFor(a,q);return `<div class="answeritem"><span>${escapeHtml(p)}：${formatAnswer(a,q)}</span><b>${points}点（差 ${diff.value.toLocaleString()}${diff.unit}）</b></div>`}).join("")}</div><p class="muted small">${isHost?"数秒後に自動で次の問題へ進みます。":"ホストが次の問題へ進めています。"}</p>`;const key=`${room}-${meta.roundIndex}`;if(isHost&&lastTransition!==key){lastTransition=key;clearTimeout(transitionJob);transitionJob=setTimeout(advanceRound,5000)}}
  async function checkAllAnswered(){if(!isHost||!meta||meta.status!=="answering")return;const n=Object.keys(playerData).length;if(n>0&&Object.keys(answers||{}).length>=n)await revealRound()}
  async function revealRound(){if(!isHost||!meta||meta.status!=="answering")return;clearInterval(timerJob);await update(ref(db,`rooms/${room}/meta`),{status:"reveal"})}
  async function advanceRound(){if(!isHost||!meta||meta.status!=="reveal")return;const next=Number(meta.roundIndex)+1,total=meta.questionCount||meta.questionOrder?.length||5;if(next>=total){await update(ref(db,`rooms/${room}/meta`),{status:"finished"});return}answers={};await update(ref(db,`rooms/${room}/meta`),{status:"answering",roundIndex:next,roundKey:String(next),deadline:Date.now()+30000})}
  async function submitAnswer(){if(!meta||meta.status!=="answering"||answers?.[uid])return;const submittedRound=meta.roundIndex,submitted={year:guess};if(hasExactDate(BANK.find(x=>x.id===meta.questionOrder[submittedRound]))){submitted.month=guessMonth;submitted.day=guessDay}try{await set(ref(db,`rooms/${room}/answers/${submittedRound}/${uid}`),submitted);if(meta?.roundIndex===submittedRound){answers={...answers,[uid]:submitted};roundsAnswers[submittedRound]=answers;renderState()}}catch(e){$("gameMessage").textContent=`回答を送信できませんでした。${errorText(e)}`}}
  function renderFinal(){const total=meta.questionCount||meta.questionOrder?.length||5,totals={};for(let round=0;round<total;round++){const q=BANK.find(x=>x.id===meta.questionOrder[round]);if(!q)continue;for(const [id,a] of Object.entries(roundsAnswers[round]||{}))totals[id]=(totals[id]||0)+scoreFor(a,q)}const ranking=Object.entries(totals).sort((a,b)=>b[1]-a[1]);$("finished").innerHTML=`<div class="center"><div class="good small">GAME COMPLETE</div><h2 style="font:500 32px Georgia,serif;margin:10px">${total}問終了！</h2><div class="answerlist">${ranking.map(([id,pts],i)=>`<div class="answeritem"><span>${i+1}位　${escapeHtml(playerData[id]?.name||"プレイヤー")}</span><b>${pts.toLocaleString()}点</b></div>`).join("")}</div><p class="notice">部屋は終了しました。新しいゲームは新しい部屋を作って始めてください。</p><button class="secondary" id="leaveFinal">最初の画面へ</button></div>`;$("leaveFinal").addEventListener("click",()=>exitRoom())}
  function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
  async function exitRoom(message=""){clearInterval(timerJob);clearTimeout(transitionJob);unsubscribers.forEach(stop=>stop());unsubscribers=[];if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;if(room&&uid)try{await set(ref(db,`rooms/${room}/players/${uid}`),null)}catch{}room=null;roomRef=null;meta=null;playerData={};answers={};roundsAnswers={};isHost=false;lastTransition="";history.replaceState({},"",location.pathname);show("setup");if(message)$("setupError").textContent=message}
  $("create").addEventListener("click",createRoom);$("join").addEventListener("click",joinRoom);$("start").addEventListener("click",startGame);$("submit").addEventListener("click",submitAnswer);$("leave").addEventListener("click",()=>exitRoom());$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(room);$("copy").textContent="コピーしました";setTimeout(()=>$("copy").textContent="コードをコピー",1800)}catch{$("lobbyMessage").textContent=`参加コードは ${room} です。長押ししてコピーしてください。`}});
  $("guessMonth").addEventListener("change",e=>{guessMonth=Number(e.target.value);syncDayOptions()});$("guessDay").addEventListener("change",e=>{guessDay=Number(e.target.value)});$("questionCount").addEventListener("change",saveLobbySettings);$("categoryFilter").addEventListener("change",()=>{populateQuestionSettings(Number($("questionCount").value)||5,$("categoryFilter").value);saveLobbySettings()});$("slider").addEventListener("input",e=>setGuess(fromPos(+e.target.value)));$("minus").addEventListener("click",()=>setGuess(guess-1));$("plus").addEventListener("click",()=>setGuess(guess+1));
  // URLに ?room=XXXXXX が付いていたら、入力欄にコードを入れておきます。
  const fromUrl=new URL(location.href).searchParams.get("room");if(fromUrl)$("roomInput").value=fromUrl.toUpperCase();setGuess(2025);loadQuestionBank();
</script></body></html>
