<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101b25"><title>Chronos Online｜世界史年号当て</title>
  <style>
    :root{color-scheme:dark;--bg:#101b25;--panel:#182833;--panel2:#20343f;--ink:#f4f0e7;--muted:#a8b6b7;--gold:#f2c66d;--teal:#79d4c5;--line:#38505a;--red:#ef8e7c}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -25%,#2d4952 0,transparent 58%),var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(880px,100%);margin:auto;padding:20px 16px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:13px;letter-spacing:.18em;color:var(--gold);font-weight:700}.tag{border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:12px;padding:7px 12px}.intro{text-align:center;margin:8px 0 20px}.intro h1{font-family:Georgia,"Yu Mincho",serif;font-size:clamp(28px,6vw,40px);font-weight:500;margin:0 0 6px}.intro p{color:var(--muted);font-size:14px;margin:0}.card{background:linear-gradient(145deg,rgba(32,52,63,.97),rgba(24,40,51,.97));border:1px solid #334c56;border-radius:20px;padding:clamp(19px,4vw,32px);box-shadow:0 20px 60px #0003}.hidden{display:none!important}h2{margin:0 0 8px}.muted{color:var(--muted)}.formrow{display:flex;gap:9px;margin:12px 0}.textinput{width:100%;min-width:0;background:#101b25;border:1px solid var(--line);border-radius:10px;padding:12px 13px;color:var(--ink)}.primary,.secondary{border:0;border-radius:11px;padding:12px 17px;font-weight:700}.primary{background:var(--gold);color:#1b2427}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#ffffff0d;color:var(--ink);border:1px solid var(--line)}.joinrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:9px}.divider{height:1px;background:var(--line);margin:20px 0}.notice{font-size:13px;color:var(--muted);line-height:1.7}.error{color:#ffb4a6;white-space:pre-wrap;font-size:13px;margin-top:12px}.roomtop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.code{font:bold 23px ui-monospace,monospace;color:var(--gold);letter-spacing:.14em}.players{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.player{background:#ffffff0a;border:1px solid var(--line);padding:8px 12px;border-radius:99px;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.meta{color:var(--muted);font-size:13px}.timer{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}.timer.urgent{color:var(--red)}.progress{height:5px;background:#30434b;border-radius:9px;overflow:hidden;margin:12px 0 22px}.progress i{display:block;height:100%;background:var(--gold);transition:width .3s}.question{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:clamp(22px,5vw,32px);line-height:1.5;text-align:center;min-height:95px;display:grid;place-items:center;margin:0 0 5px}.axis-head{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.axis{position:relative;height:70px;padding:0 5px}.axis input{appearance:none;width:100%;height:5px;border-radius:10px;background:linear-gradient(90deg,#71807e,#d3b56c);outline:none;margin:28px 0}.axis input::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--gold);border:4px solid #fff3;box-shadow:0 0 0 2px var(--gold)}.axis input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:4px solid #fff3;box-shadow:0 0 0 2px var(--gold)}.ticks{display:flex;justify-content:space-between;position:absolute;left:0;right:0;top:45px;color:#87999b;font-size:9px;pointer-events:none}.ticks span{transform:translateX(-50%)}.ticks span:first-child{transform:none}.ticks span:last-child{transform:none}.answerline{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px auto 18px}.answerline button{border:1px solid var(--line);color:var(--ink);background:#ffffff08;border-radius:10px;min-width:40px;height:38px;font-size:20px}.answerline output{font-size:21px;font-weight:650;min-width:116px;text-align:center}.center{text-align:center}.small{font-size:12px}.resultbox{background:#ffffff08;border:1px solid var(--line);border-radius:13px;padding:14px;margin:14px 0}.answerlist{display:grid;gap:7px;margin-top:12px}.answeritem{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff13;font-size:13px}.good{color:var(--teal)}.foot{text-align:center;color:#829394;font-size:11px;line-height:1.7;margin:17px 8px 0}@media(max-width:560px){.joinrow{grid-template-columns:1fr 1fr}.joinrow button{grid-column:1/-1}.formrow{flex-direction:column}.card{border-radius:17px}.question{min-height:110px}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div class="brand">CHRONOS <span style="color:#a8b6b7;font-weight:400">/ ONLINE</span></div><div class="tag">友達と対戦</div></header>
  <section class="intro"><h1>歴史の一点を、見つけよう。</h1><p>同じ出来事に答えて、年号の近さで競います。</p></section>
  <section id="setup" class="card"><h2>オンライン対戦を始める</h2><p class="notice">表示名を決めて、部屋を作るか、友達の部屋コードで参加してください。アカウント登録は不要です。</p>
    <label class="small muted" for="name">あなたの表示名</label><div class="formrow"><input class="textinput" id="name" maxlength="12" placeholder="例：あき" autocomplete="nickname"></div>
    <div class="joinrow"><button class="primary" id="create">部屋を作る</button><input class="textinput" id="roomInput" maxlength="6" placeholder="6文字のコード" autocomplete="off"><button class="secondary" id="join">コードで参加</button></div>
    <div id="setupError" class="error"></div>
    <div class="divider"></div><p class="notice">※この画面を遊ぶ前に、ガイドの手順でFirebase設定値を入力してください。友達と試すための試作版です。</p>
  </section>
  <section id="lobby" class="card hidden"><div class="roomtop"><div><div class="meta">部屋コード（友達に共有）</div><div class="code" id="roomCode"></div></div><button class="secondary" id="copy">コードをコピー</button></div><div class="divider"></div><div class="row"><strong>参加者</strong><span class="meta" id="playerCount"></span></div><div class="players" id="players"></div><p class="notice" id="lobbyMessage"></p><div class="center"><button class="primary hidden" id="start">ゲーム開始（5問）</button></div><div id="lobbyError" class="error"></div><div class="center" style="margin-top:14px"><button class="secondary" id="leave">部屋を出る</button></div></section>
  <section id="game" class="card hidden"><div class="row"><div class="meta" id="roundLabel"></div><div class="timer" id="timer"></div></div><div class="progress"><i id="progress"></i></div><h2 class="question" id="question"></h2><p class="center muted small" id="gameMessage"></p><div class="axis-head"><span>紀元前2000年</span><span>現代</span></div><div class="axis"><input id="slider" type="range" min="0" max="10000" step="1" value="0" aria-label="回答する年"><div class="ticks"><span>紀元前2000</span><span>紀元前1</span><span>1000</span><span>1800</span><span>現代</span></div></div><div class="answerline"><button id="minus" aria-label="1年戻る">−</button><output id="chosenYear"></output><button id="plus" aria-label="1年進む">＋</button></div><div class="center"><button class="primary" id="submit">この年に回答する</button></div><div class="resultbox hidden" id="roundResult"></div></section>
  <section id="finished" class="card hidden"></section>
  <p class="foot">最初のオンライン試作です。問題の正解はゲーム画面のファイルに含まれるため、厳密な不正対策はありません。</p>
</main>
<script type="module">
  // Firebaseコンソールの「ウェブアプリ設定」からコピーして、下の値を置き換えてください。
  const firebaseConfig = {
    apiKey: "AIzaSyDnjLOsEYsmTK0WykkyorzUUbGC4-Qarlc",
    authDomain: "nengouguesser.firebaseapp.com",
    databaseURL: "https://nengouguesser-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nengouguesser",
    storageBucket: "nengouguesser.firebasestorage.app",
    messagingSenderId: "992435991923",
    appId: "1:992435991923:web:230539c977c42afe8ac106"
  };
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
  import { getDatabase, ref, get, set, update, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

  const BANK=[
    {id:"q01",event:"バビロン第一王朝が成立した",era:"BCE",year:1894,note:"成立年には諸説があります。このデモでは紀元前1894年ごろを採用。"},
    {id:"q02",event:"ハンムラビ法典が整備された",era:"BCE",year:1754,note:"このデモでは紀元前1754年ごろを採用。"},
    {id:"q03",event:"古代オリンピックの最初の記録が残る",era:"BCE",year:776,note:"伝統的に紀元前776年を最初の記録として扱います。"},
    {id:"q04",event:"アレクサンドロス大王が東方遠征を開始した",era:"BCE",year:334,note:"マケドニア軍がアジアへ渡った紀元前334年を採用。"},
    {id:"q05",event:"ローマで共和政が始まったと伝えられる",era:"BCE",year:509,note:"伝承上の年である紀元前509年を採用。"},
    {id:"q06",event:"西ローマ帝国が滅亡した",era:"CE",year:476,note:"一般的な区切りとして476年を採用。"},
    {id:"q07",event:"ムハンマドがメッカからメディナへ移住した",era:"CE",year:622,note:"ヒジュラの年である622年を採用。"},
    {id:"q08",event:"ノルマン・コンクエストでヘイスティングズの戦いが起きた",era:"CE",year:1066,note:"ヘイスティングズの戦いが起きた1066年を採用。"},
    {id:"q09",event:"イングランド王がマグナ・カルタに封印した",era:"CE",year:1215,note:"ジョン王が大憲章に封印した1215年を採用。"},
    {id:"q10",event:"コンスタンティノープルがオスマン帝国に征服された",era:"CE",year:1453,note:"東ローマ帝国の終焉を象徴する1453年を採用。"},
    {id:"q11",event:"コロンブスの航海がカリブ海地域に到達した",era:"CE",year:1492,note:"到達した1492年を採用。"},
    {id:"q12",event:"フランス革命が始まった",era:"CE",year:1789,note:"革命の始まりを示す1789年を採用。"},
    {id:"q13",event:"第一次世界大戦が始まった",era:"CE",year:1914,note:"開戦した1914年を採用。"},
    {id:"q14",event:"第二次世界大戦が終結した",era:"CE",year:1945,note:"終結年として1945年を採用。"},
    {id:"q15",event:"ベルリンの壁が崩壊した",era:"CE",year:1989,note:"壁の開放につながった1989年を採用。"}
  ];
  const MIN=-1999,MAX=new Date().getFullYear(),BREAKS=[MIN,0,1000,1800,MAX],WEIGHTS=[.15,.18,.27,.40];
  const $=id=>document.getElementById(id),views=["setup","lobby","game","finished"];
  let app,auth,db,uid=null,room=null,roomRef=null,isHost=false,meta=null,playerData={},answers={},roundsAnswers={},guess=2025,timerJob=null,transitionJob=null,working=false,lastTransition="",unsubscribers=[],answerUnsubscribe=null,answerListenerRound=null;
  const show=(id)=>views.forEach(x=>$(x).classList.toggle("hidden",x!==id));
  const displayYear=y=>y<=0?`紀元前${1-y}年`:`${y}年`;
  const answerYear=q=>q.era==="BCE"?1-q.year:q.year;
  const eventYear=q=>q.era==="BCE"?`紀元前${q.year}年`:`${q.year}年`;
  function fromPos(value){let p=value/10000,acc=0;for(let i=0;i<WEIGHTS.length;i++){let w=WEIGHTS[i];if(p<=acc+w||i===WEIGHTS.length-1){let t=Math.max(0,Math.min(1,(p-acc)/w));return Math.round(BREAKS[i]+t*(BREAKS[i+1]-BREAKS[i]))}acc+=w}return MAX}
  function toPos(y){for(let i=0;i<WEIGHTS.length;i++){if(y<=BREAKS[i+1]||i===WEIGHTS.length-1){let acc=WEIGHTS.slice(0,i).reduce((a,b)=>a+b,0),t=(y-BREAKS[i])/(BREAKS[i+1]-BREAKS[i]);return Math.round((acc+Math.max(0,Math.min(1,t))*WEIGHTS[i])*10000)}}return 10000}
  function setGuess(y){guess=Math.max(MIN,Math.min(MAX,Math.round(y)));$("slider").value=toPos(guess);$("chosenYear").textContent=displayYear(guess)}
  function scoreFor(y,q){return Math.round(1000/(1+Math.abs(y-answerYear(q))/100))}
  function validConfig(){return !JSON.stringify(firebaseConfig).includes("ここに")}
  async function connect(){if(!validConfig())throw new Error("Firebaseの設定値がまだ入っていません。ガイドの「コードの設定」を先に行ってください。");if(!app){app=initializeApp(firebaseConfig);auth=getAuth(app);db=getDatabase(app)}if(!auth.currentUser)await signInAnonymously(auth);uid=auth.currentUser.uid}
  function cleanName(){let s=$("name").value.trim().replace(/[<>]/g,"").slice(0,12);if(!s)throw new Error("表示名を入力してください。");return s}
  function code(){return Math.random().toString(36).slice(2,8).toUpperCase().replace(/[IO]/g,"X")}
  function setUrlRoom(c){const u=new URL(location.href);u.searchParams.set("room",c);history.replaceState({},"",u)}
  function listen(c){unsubscribers.forEach(stop=>stop());unsubscribers=[];if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;room=c;roomRef=ref(db,`rooms/${c}`);roundsAnswers={};unsubscribers.push(onValue(ref(db,`rooms/${c}/meta`),snap=>{const previous=meta;meta=snap.val();if(!meta){exitRoom("部屋が見つからないか、終了しました。");return}if(previous&&previous.roundIndex!==meta.roundIndex)answers=roundsAnswers[meta.roundIndex]||{};renderState();const canRead=isHost||meta.status==="reveal"||meta.status==="finished";if(!canRead){if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;return}if(answerListenerRound!==meta.roundIndex){if(answerUnsubscribe)answerUnsubscribe();answerListenerRound=meta.roundIndex;const round=meta.roundIndex;answerUnsubscribe=onValue(ref(db,`rooms/${c}/answers/${round}`),s=>{roundsAnswers[round]=s.val()||{};if(meta?.roundIndex===round)answers=roundsAnswers[round];renderState();checkAllAnswered()},err=>errorInLobby(err))}},err=>errorInLobby(err)));unsubscribers.push(onValue(ref(db,`rooms/${c}/players`),snap=>{playerData=snap.val()||{};renderPlayers();checkAllAnswered()},err=>errorInLobby(err)));renderState()}
  async function createRoom(){if(working)return;working=true;$("setupError").textContent="";try{const name=cleanName();await connect();let made=false,c="",hostMeta;for(let i=0;i<8&&!made;i++){c=code();hostMeta={hostUid:uid,status:"lobby",roundIndex:0,roundKey:"0",questionOrder:shuffle(BANK).slice(0,5).map(q=>q.id),deadline:0,createdAt:Date.now()};const result=await runTransaction(ref(db,`rooms/${c}/meta`),current=>current===null?hostMeta:undefined);made=result.committed}if(!made)throw new Error("部屋コードを作れませんでした。もう一度お試しください。");isHost=true;await enterPlayer(c,name);setUrlRoom(c)}catch(e){$("setupError").textContent=errorText(e)}finally{working=false}}
  async function joinRoom(){if(working)return;working=true;$("setupError").textContent="";try{const name=cleanName(),c=$("roomInput").value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(c))throw new Error("部屋コードは6文字で入力してください。");await connect();const s=await get(ref(db,`rooms/${c}/meta`)),m=s.val();if(!m)throw new Error("部屋が見つかりません。コードを確認してください。");if(m.status!=="lobby")throw new Error("この部屋はすでにゲーム中です。");isHost=false;await enterPlayer(c,name);setUrlRoom(c)}catch(e){$("setupError").textContent=errorText(e)}finally{working=false}}
  async function enterPlayer(c,name){await set(ref(db,`rooms/${c}/players/${uid}`),{name,joinedAt:Date.now()});onDisconnect(ref(db,`rooms/${c}/players/${uid}`)).remove();$("roomCode").textContent=c;$("lobbyError").textContent="";show("lobby");listen(c)}
  function renderPlayers(){if(!room)return;const list=Object.entries(playerData);$("players").innerHTML=list.map(([id,p])=>`<span class="player">${escapeHtml(p.name||"プレイヤー")}${id===meta?.hostUid?" · ホスト":""}</span>`).join("")||"<span class='muted small'>参加者を待っています…</span>";$("playerCount").textContent=`${list.length}人`;$(("start")).classList.toggle("hidden",!(isHost&&meta?.status==="lobby"));$("lobbyMessage").textContent=isHost?"友達にコードを共有し、参加者がそろったら開始してください。":"ホストがゲームを開始するまでお待ちください。"}
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
  function errorText(e){return e?.code?`${e.message||e.code}\nエラーコード: ${e.code}`:(e?.message||String(e))}
  function errorInLobby(e){$("lobbyError").textContent=errorText(e)}
  async function startGame(){if(!isHost||Object.keys(playerData).length<2)return;const now=Date.now();await update(ref(db,`rooms/${room}/meta`),{status:"answering",roundIndex:0,roundKey:"0",deadline:now+30000});}
  function renderState(){if(!meta||!room)return;$("roomCode").textContent=room;renderPlayers();if(meta.status==="lobby"){show("lobby");return}if(meta.status==="finished"){show("finished");renderFinal();return}show("game");const q=BANK.find(x=>x.id===meta.questionOrder[meta.roundIndex]);if(!q)return;$("roundLabel").textContent=`第${meta.roundIndex+1}問 / 5問`;$("progress").style.width=`${(meta.roundIndex+1)*20}%`;$("question").textContent=q.event;const submitted=answers?.[uid];$("submit").disabled=Boolean(submitted)||meta.status!=="answering";$("slider").disabled=$("submit").disabled;$("minus").disabled=$("submit").disabled;$("plus").disabled=$("submit").disabled;$("gameMessage").textContent=meta.status==="answering"?(submitted?"回答済みです。他の人の回答を待っています。":`回答した人数: ${Object.keys(answers||{}).length} / ${Object.keys(playerData).length}人`):"回答を締め切りました。結果を確認してください。";if(meta.status==="reveal")renderRoundResult(q);else $("roundResult").classList.add("hidden");setGuess(guess);startTimer();}
  function startTimer(){clearInterval(timerJob);timerJob=setInterval(()=>{if(!meta||meta.status!=="answering"){$("timer").textContent="";clearInterval(timerJob);return}let left=Math.max(0,Math.ceil((meta.deadline-Date.now())/1000));$("timer").textContent=`残り ${left} 秒`;$("timer").classList.toggle("urgent",left<=5);if(left===0&&isHost)revealRound()},200)}
  function renderRoundResult(q){const entries=Object.entries(answers||{});$("roundResult").classList.remove("hidden");$("roundResult").innerHTML=`<div class="good"><b>正解：${eventYear(q)}</b></div><div class="muted small">${escapeHtml(q.note)}</div><div class="answerlist">${entries.map(([id,a])=>{const p=playerData[id]?.name||"退出したプレイヤー",points=scoreFor(a.year,q);return `<div class="answeritem"><span>${escapeHtml(p)}：${displayYear(a.year)}</span><b>${points}点（差 ${Math.abs(a.year-answerYear(q)).toLocaleString()}年）</b></div>`}).join("")}</div><p class="muted small">${isHost?"数秒後に自動で次の問題へ進みます。":"ホストが次の問題へ進めています。"}</p>`;const key=`${room}-${meta.roundIndex}`;if(isHost&&lastTransition!==key){lastTransition=key;clearTimeout(transitionJob);transitionJob=setTimeout(advanceRound,5000)}}
  async function checkAllAnswered(){if(!isHost||!meta||meta.status!=="answering")return;const n=Object.keys(playerData).length;if(n>0&&Object.keys(answers||{}).length>=n)await revealRound()}
  async function revealRound(){if(!isHost||!meta||meta.status!=="answering")return;clearInterval(timerJob);await update(ref(db,`rooms/${room}/meta`),{status:"reveal"})}
  async function advanceRound(){if(!isHost||!meta||meta.status!=="reveal")return;const next=Number(meta.roundIndex)+1;if(next>=5){await update(ref(db,`rooms/${room}/meta`),{status:"finished"});return}answers={};await update(ref(db,`rooms/${room}/meta`),{status:"answering",roundIndex:next,roundKey:String(next),deadline:Date.now()+30000})}
  async function submitAnswer(){if(!meta||meta.status!=="answering"||answers?.[uid])return;try{await set(ref(db,`rooms/${room}/answers/${meta.roundIndex}/${uid}`),{year:guess});$("gameMessage").textContent="回答を送信しました。全員の回答を待っています。"}catch(e){$("gameMessage").textContent=errorText(e)}}
  function renderFinal(){const totals={};for(let round=0;round<5;round++){const q=BANK.find(x=>x.id===meta.questionOrder[round]);for(const [id,a] of Object.entries(roundsAnswers[round]||{}))totals[id]=(totals[id]||0)+scoreFor(a.year,q)}const ranking=Object.entries(totals).sort((a,b)=>b[1]-a[1]);$("finished").innerHTML=`<div class="center"><div class="good small">GAME COMPLETE</div><h2 style="font:500 32px Georgia,serif;margin:10px">5問終了！</h2><div class="answerlist">${ranking.map(([id,pts],i)=>`<div class="answeritem"><span>${i+1}位　${escapeHtml(playerData[id]?.name||"プレイヤー")}</span><b>${pts.toLocaleString()}点</b></div>`).join("")}</div><p class="notice">部屋は終了しました。新しいゲームは新しい部屋を作って始めてください。</p><button class="secondary" id="leaveFinal">最初の画面へ</button></div>`;$("leaveFinal").addEventListener("click",()=>exitRoom())}
  function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
  async function exitRoom(message=""){clearInterval(timerJob);clearTimeout(transitionJob);unsubscribers.forEach(stop=>stop());unsubscribers=[];if(answerUnsubscribe)answerUnsubscribe();answerUnsubscribe=null;answerListenerRound=null;if(room&&uid)try{await set(ref(db,`rooms/${room}/players/${uid}`),null)}catch{}room=null;roomRef=null;meta=null;playerData={};answers={};roundsAnswers={};isHost=false;lastTransition="";history.replaceState({},"",location.pathname);show("setup");if(message)$("setupError").textContent=message}
  $("create").addEventListener("click",createRoom);$("join").addEventListener("click",joinRoom);$("start").addEventListener("click",startGame);$("submit").addEventListener("click",submitAnswer);$("leave").addEventListener("click",()=>exitRoom());$("copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(room);$("copy").textContent="コピーしました";setTimeout(()=>$("copy").textContent="コードをコピー",1800)}catch{$("lobbyMessage").textContent=`参加コードは ${room} です。長押ししてコピーしてください。`}});
  $("slider").addEventListener("input",e=>setGuess(fromPos(+e.target.value)));$("minus").addEventListener("click",()=>setGuess(guess-1));$("plus").addEventListener("click",()=>setGuess(guess+1));
  // URLに ?room=XXXXXX が付いていたら、入力欄にコードを入れておきます。
  const fromUrl=new URL(location.href).searchParams.get("room");if(fromUrl)$("roomInput").value=fromUrl.toUpperCase();setGuess(2025);
</script></body></html>
